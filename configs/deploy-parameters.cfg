# -------------------------------------------------------------------------------------------------
# --------------------------------- DEPLOY CONFIGURATION SET UP -----------------------------------
#
# AWS Cloud Formation will setup this file automatically
# otherwise you can edit it manually to set the parameters for your lab deployment
# if you change this file you ***MUST*** re-run "setup-lab.sh --deploy" again

# Set the "domain name" you're using for the cloud Lab
DOMAIN="%DOMAIN%"
PARENT="%PARENT%"

# Indicate "public IP addresses" of the main cloud server instance
IPv4ServerAddr="%IPV4ADDRESS%"
IPv6ServerAddr="%IPV6ADDRESS%"

# LABTYPE (please see documentation for possible values)
LABTYPE="%LABTYPE%"

# Networks to install
NETWORKS="%NETWORKS%"

# Optional password for the shared "labuser" account
# If empty, a random password will be generated
SinglePassword="%SINGLEPASSWORD%"

# IPv6 ULA prefix, selected at time of lab setup
# we now use the same prefix for all labs, makes documentation easier
IPv6prefix="fd89:59e0"

# URL of the zip download of the lab instructions 
INSTRUCTIONS="%INSTRUCTIONS%"

### Set VPN parameters for creating VPN link with ISP @iborder-rtr router (only if you're creating a border router)

# Name for the VPN peer 
VPNpeerName="%VPNpeerName%"

# Port where your side of the VPN will listen to
VPNlistenPort="%VPNlistenPort%"

# Set the private Key you generated and shared with the ISP 
VPNprivateKey="%VPNprivateKey%"

# Set private IP addres and Mask for local VPN interface termination
VPNlocalIPv4="%VPNlocalIPv4%"

# Set the public Key provided by your ISP
VPNpublicKey="%VPNpublicKey%"

# Set private IP prefix that's going to be allowed (the single IP address of ISP side of the VPN)
VPNallowedPrefixIPv4="%VPNallowedPrefixIPv4%"

# Set public IP address and port of VPN endpoint (the ISP side of the VPN)
VPNendPointIPv4="%VPNendPointIPv4%"
