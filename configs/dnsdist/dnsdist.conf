-- dnsdist configuration
--
-- Public DNS frontend for OCTO-TE Labs.
--
-- Infrastructure:
--   100.64.0.53  dnsdist
--   100.64.0.54  ns1 / auth-platform
--

setLocal('100.64.0.53')
addLocal('%IPv6pfx%:0::53')

--
-- Control socket
--
-- controlSocket('127.0.0.1:5199')

--
-- ACL
--
addACL('0.0.0.0/0')
addACL('::0/0')

--
-- Security
--
addAction(OpcodeRule(DNSOpcode.Notify), RCodeAction(DNSRCode.REFUSED))
addAction(OpcodeRule(DNSOpcode.Update), RCodeAction(DNSRCode.REFUSED))
addAction(QTypeRule(DNSQType.AXFR), RCodeAction(DNSRCode.REFUSED))
addAction(QTypeRule(DNSQType.IXFR), RCodeAction(DNSRCode.REFUSED))
addAction(QClassRule(DNSClass.CHAOS), RCodeAction(DNSRCode.REFUSED))

--
-- Disable security status polling via DNS
--
setSecurityPollSuffix("")

--
-- Server selection policy
--
setServerPolicy(roundrobin)

--
-- Platform authoritative DNS
--
newServer({
    address="100.64.0.54",
    pool="auth-platform",
    healthCheckMode='lazy',
    checkInterval=30
}):setUp()