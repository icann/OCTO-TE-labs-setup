AWSTemplateFormatVersion: '2010-09-09'
Description: 'ICANN OCTO-TE EC2 Lab stack (nico)'
Parameters:
  DnsParent:
    Type: String
    Description: "Parent Domain for the lab (must be in Route53) and contain trailing dot!"
    Default: "%DNS_PARENT_DEFAULT%"
  DnsName:
    Type: String
    Description: "DNS label for the lab. Lowercase letters, numbers, and hyphens are allowed."
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
    ConstraintDescription: "Use lowercase letters, numbers, and hyphens only. The value must start and end with a letter or number."
    MinLength: 3
    MaxLength: 32
  Owner:
    Type: String
    Description: "Who is responsible for this lab?"
  Participants:
    Type: String
    Description: "How many groups do you want run?"
    AllowedPattern: "[0-9]+"
    ConstraintDescription: "Numbers between 1 and 64"
    Default: "3"
    MaxLength: 2
    MinLength: 1
  LabType:
    Type: String
    Description: "Which type of lab do you want to run? (1=resolver only, 2=full dns, 3=router (global rpki), 4=router (group rpki))"
    AllowedValues:
      - 1
      - 2
      - 3
      - 4
    Default: 2
  LatestUbuntu:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/canonical/ubuntu/server/noble/stable/current/amd64/hvm/ebs-gp3/ami-id'
    Description: "*DO NOT CHANGE* AWS needs this value to find the latest Ubuntu image"
  AmiOverride:
    Type: String
    Default: ""
    Description: "Optional explicit AMI ID used to preserve an existing EC2 instance during stack updates. Leave empty for normal deployments."
  S3Bucket:
    Type: String
    Description: Bucket that contains lab setup scripts and configs
    Default: %S3BUCKET%
  labInstanceType:
    Type: String
    Description: "Instance type for the lab. Please check with AWS for allowed values. (Changes by region)"
    Default: "r4.2xlarge"
  labInstructions:
    Type: String
    Description: "Instructions for the lab. Will be copied to the lab server and available via webserver"
    Default: "%LAB_INSTRUCTIONS_URL%"
  labSinglePassword:
    Type: String
    Description: "Optional password for the shared labuser account. Leave empty to generate a random password automatically."
    Default: ""
    NoEcho: true
Conditions:
  UseAmiOverride: !Not [!Equals [!Ref AmiOverride, ""]]

Resources:

  labKey:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyFormat: pem
      KeyName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - 'Key'
      PublicKeyMaterial: %SSH_PUBLIC_KEY%

  labIpv6CidrBlock:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref labVPC
      AmazonProvidedIpv6CidrBlock: true

  labVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: 'true'
      EnableDnsHostnames: 'false'
      Tags:
       - Key: Name
         Value: !Ref 'AWS::StackName'
  
  labSubnet:
    DependsOn: 
      - labVPC
      - labIpv6CidrBlock
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 10.0.1.0/24
      Ipv6CidrBlock: !Select
        - 0
        - !Cidr
          - !Select
            - 0
            - !GetAtt labVPC.Ipv6CidrBlocks
          - 1
          - 64
      VpcId: !Ref labVPC
      MapPublicIpOnLaunch: false
      AssignIpv6AddressOnCreation: true 
      Tags:
        - Key: Name
          Value: !Ref 'AWS::StackName'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Ref 'AWS::StackName'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref labVPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref labVPC
      Tags:
        - Key: Name
          Value: !Ref 'AWS::StackName'

  PublicIPv4Route:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicIPv6Route:
    Type: AWS::EC2::Route
    Properties:
      DestinationIpv6CidrBlock: ::/0
      RouteTableId: !Ref PublicRouteTable
      GatewayId: !Ref InternetGateway
      
  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref labSubnet
      RouteTableId: !Ref PublicRouteTable

  IPAddress:
    Type: AWS::EC2::EIP
    Properties:
      Tags:
        - Key: Name
          Value: !Ref 'AWS::StackName'

  IPAssoc:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref labInstance
      AllocationId: !GetAtt IPAddress.AllocationId

  labSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Access to the TE-Lab
      VpcId: !Ref labVPC
      Tags:
        - Key: Name
          Value: !Ref 'AWS::StackName'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8484
          ToPort: 8484
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8484
          ToPort: 8484
          CidrIpv6: ::0/0
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIpv6: ::0/0
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIpv6: ::0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIpv6: ::0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: ::0/0

  labInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join
      - '-'
      - - !Ref 'AWS::StackName'
        - 'labInstanceRole'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /

  labInstanceS3Policy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: labInstanceS3Policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Action:
              - "s3:Get*"
              - "s3:List*"
              - "s3:Describe*"
              - "s3-object-lambda:Get*"
              - "s3-object-lambda:List*"
            Resource:
              - arn:aws:s3:::%S3BUCKET%*
      Roles:
        - !Ref labInstanceRole

  labInstanceRoute53Policy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: labInstanceRoute53Policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - "route53:ListHostedZonesByName"
              - "route53:ChangeResourceRecordSets"
              - "route53:ListResourceRecordSets"
              - "route53:GetChange"
            Resource: '*'
      Roles:
        - !Ref labInstanceRole

  labInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: 
      InstanceProfileName: !Ref 'AWS::StackName'
      Path: /
      Roles: 
       - !Ref labInstanceRole

  labInstance:
    DependsOn: 
      - labVPC
      - labSubnet
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !If
        - UseAmiOverride
        - !Ref AmiOverride
        - !Ref LatestUbuntu
      InstanceType: !Ref labInstanceType
      KeyName: !Ref labKey
      SubnetId: !Ref labSubnet
      IamInstanceProfile: !Ref labInstanceProfile
      Tags:
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: Owner
          Value: !Ref Owner
      SecurityGroupIds:
        - !Ref labSecurityGroup      
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: '512'
            DeleteOnTermination: 'true'
            Encrypted: 'true'      
      UserData: !Base64
        Fn::Sub: |-
          #!/bin/bash
          #
          # set to fail on anything and prompt all commands
          #
          set -exou
          #
          # move SSH to port 8484
          #
          sed -i -e 's/#Port 22/Port 8484/' /etc/ssh/sshd_config
          sudo systemctl daemon-reload
          sudo systemctl restart ssh.socket
          #
          # non-interactive install only
          #
          export DEBIAN_FRONTEND=noninteractive
          #
          # install latest ubuntu updates
          #
          apt-get -yq update 
          apt-get -yq full-upgrade
          #
          # install AWS cli client
          #
          snap install aws-cli --classic
          #
          # we run everything from this directory
          #
          cd /root
          #
          # copy files from S3
          #
          aws s3 cp s3://${S3Bucket} . --recursive --no-progress
          chmod -R +x scripts/*
          #
          # for remaining actions we need to be in the scripts folder
          cd scripts
          #
          # setup DEPLOY parameters
          #
          DOMAIN=$(perl -e '$_=lc("${DnsName}.${DnsParent}");s/\.$//;print $_;')
          IPv4=${IPAddress.PublicIp}
          until IPv6=$(ip a s scope global | perl -n -e'print $1 if m/inet6\s+(\S+)\/128/'); [ -n "$IPv6" ]; do echo "Waiting..."; sleep 1; done;
          #
          # setup optional single lab password
          #
          # Disable command tracing while handling the password so it is not
          # exposed in the deployment logs.
          #
          set +x
          LAB_SINGLE_PASSWORD=$(cat <<'LAB_PASSWORD_EOF'
          ${labSinglePassword}
          LAB_PASSWORD_EOF
          )
          #
          # Escape characters that have special meaning in the sed
          # replacement expression.
          #
          LAB_SINGLE_PASSWORD_SED=$(printf '%s' "$LAB_SINGLE_PASSWORD" | perl -pe 's/([\\&|])/\\$1/g')
          #
          # generate deploy-parameters.cfg
          #
          sed -e "s/%DOMAIN%/$DOMAIN/g"  \
              -e "s/%PARENT%/${DnsParent}/g"  \
              -e "s/%IPV4ADDRESS%/$IPv4/g"  \
              -e "s/%IPV6ADDRESS%/$IPv6/g"  \
              -e "s/%LABTYPE%/${LabType}/g"   \
              -e "s/%NETWORKS%/${Participants}/g" \
              -e "s|%INSTRUCTIONS%|${labInstructions}|g" \
              -e "s|%SINGLEPASSWORD%|$LAB_SINGLE_PASSWORD_SED|g" \
              ../configs/deploy-parameters.cfg > ./deploy-parameters.cfg
          #
          # Remove password variables from the environment and restore
          # command tracing.
          #
          unset LAB_SINGLE_PASSWORD
          unset LAB_SINGLE_PASSWORD_SED
          set -x
          #
          # initialize lab server
          #
          ./setup-host.sh
          ./setup-containers.sh
          #
          # now deploy the lab
          #
          ./setup-lab.sh --deploy
          #
          # Finally we are
          #
          echo "DONE"

  labLambdaGetIntstanceIpv6Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      Policies: 
      - PolicyName: labLambdaGetIntstanceIpv6Policy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource: arn:aws:logs:*:*:*
          - Effect: Allow
            Action:
            - ec2:DescribeNetworkInterfaces
            Resource: "*"

  labLambdaGetIntstanceIpv6Function:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Description: "Retrieves IPv6 address of EC2 instance"
      Timeout: 30
      Role: !GetAtt 'labLambdaGetIntstanceIpv6Role.Arn'
      Runtime: python3.13
      Code:
        ZipFile: |
          import json
          import logging
          import cfnresponse
          import boto3
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
            logger.info('got event {}'.format(event))
            try:
              if event['RequestType'] == 'Delete':
                cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                return
              #
              # Anything else we try to get the IPv6 address
              #
              # 1. retrieve resource reference ID or Name
              InstanceId=event['ResourceProperties']['InstanceId']
              # 2. retrieve boto3 client
              client = boto3.client('ec2')
              # 3. Invoke describe/retrieve function using InstanceId
              response = response=client.describe_network_interfaces(Filters=[{'Name':'attachment.instance-id', 'Values':[InstanceId] }])
              # 4. Parse and return required attributes
              responseData = {}
              responseData['Ipv6Address'] = response.get('NetworkInterfaces')[0]['Ipv6Addresses'][0]['Ipv6Address']
              logger.info('Retrieved IPv6 address: %s' % responseData['Ipv6Address'])
              cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
            except Exception as err:
              logger.error(err)
              responseData = {"Data": str(err)}
              cfnresponse.send(event,context,cfnresponse.FAILED,responseData)

  labInstanceIpv6:
    Type: Custom::labInstanceIpv6
    Properties:
      ServiceToken: !GetAtt labLambdaGetIntstanceIpv6Function.Arn
      ServiceTimeout: 30
      Region: !Ref AWS::Region
      InstanceId: !GetAtt labInstance.InstanceId

  labDnsCleanupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: labDnsCleanupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - route53:ListHostedZonesByName
                  - route53:ListResourceRecordSets
                  - route53:ChangeResourceRecordSets
                  - route53:GetChange
                Resource: "*"

  labDnsCleanupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Description: "Removes Route53 records created outside CloudFormation"
      Timeout: 30
      Role: !GetAtt labDnsCleanupRole.Arn
      Runtime: python3.13
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
              logger.info("got event %s", event)

              try:
                  if event["RequestType"] != "Delete":
                      cfnresponse.send(
                          event,
                          context,
                          cfnresponse.SUCCESS,
                          {}
                      )
                      return

                  parent = event["ResourceProperties"]["DnsParent"]
                  domain = event["ResourceProperties"]["Domain"]

                  if not parent.endswith("."):
                      parent += "."

                  if not domain.endswith("."):
                      domain += "."

                  route53 = boto3.client("route53")

                  response = route53.list_hosted_zones_by_name(
                      DNSName=parent,
                      MaxItems="1"
                  )

                  zones = response.get("HostedZones", [])

                  if not zones or zones[0]["Name"] != parent:
                      logger.warning(
                          "Parent hosted zone %s not found; nothing to clean",
                          parent
                      )
                      cfnresponse.send(
                          event,
                          context,
                          cfnresponse.SUCCESS,
                          {}
                      )
                      return

                  hosted_zone_id = zones[0]["Id"].split("/")[-1]

                  response = route53.list_resource_record_sets(
                      HostedZoneId=hosted_zone_id,
                      StartRecordName=domain,
                      StartRecordType="DS",
                      MaxItems="1"
                  )

                  records = response.get("ResourceRecordSets", [])

                  if (
                      records
                      and records[0].get("Name") == domain
                      and records[0].get("Type") == "DS"
                  ):
                      logger.info("Deleting DS record for %s", domain)

                      route53.change_resource_record_sets(
                          HostedZoneId=hosted_zone_id,
                          ChangeBatch={
                              "Comment": "CloudFormation cleanup for lab DS",
                              "Changes": [
                                  {
                                      "Action": "DELETE",
                                      "ResourceRecordSet": records[0]
                                  }
                              ]
                          }
                      )
                  else:
                      logger.info(
                          "No DS record exists for %s; nothing to delete",
                          domain
                      )

                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.SUCCESS,
                      {}
                  )

              except Exception as err:
                  logger.exception("DNS cleanup failed")
                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.FAILED,
                      {"Error": str(err)}
                  )

  labDnsCleanup:
    Type: Custom::labDnsCleanup
    Properties:
      ServiceToken: !GetAtt labDnsCleanupFunction.Arn
      ServiceTimeout: 30
      DnsParent: !Ref DnsParent
      Domain: !Sub "${DnsName}.${DnsParent}"

  labNS:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Ref DnsParent
      Name: !Sub "${DnsName}.${DnsParent}"
      Type: NS
      TTL: '30'
      ResourceRecords:
        - !Sub "ns1.${DnsName}.${DnsParent}"

  ns1A:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Ref DnsParent
      Name: !Sub "ns1.${DnsName}.${DnsParent}"
      Type: A
      TTL: '30'
      ResourceRecords:
        - !GetAtt IPAddress.PublicIp

  ns1AAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Ref DnsParent
      Name: !Sub "ns1.${DnsName}.${DnsParent}"
      Type: AAAA
      TTL: '30'
      ResourceRecords:
        - !GetAtt labInstanceIpv6.Ipv6Address

  ec2A:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Ref DnsParent
      Name: !Sub "ec2-${DnsName}.${DnsParent}"
      Type: A
      TTL: '30'
      ResourceRecords:
        - !GetAtt IPAddress.PublicIp

  ec2AAAA:
    Type: AWS::Route53::RecordSet
    Properties:    
      HostedZoneName: !Ref DnsParent
      Name: !Sub "ec2-${DnsName}.${DnsParent}"
      Type: AAAA
      TTL: '30'
      ResourceRecords: 
        - !GetAtt labInstanceIpv6.Ipv6Address
